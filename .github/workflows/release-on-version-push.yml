name: Release Roxy Suite on version push

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: roxy-suite-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          FILE="roxy-suite.php"
          if [[ ! -f "$FILE" ]]; then
            echo "Plugin base file not found: $FILE"
            exit 1
          fi

          HEADER_VERSION="$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*' "$FILE" | sed -E 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//')"
          CONST_VERSION="$(grep -m1 -E "define\('ROXY_SUITE_VERSION',[[:space:]]*'[^']+'\);" "$FILE" | sed -E "s/.*define\('ROXY_SUITE_VERSION',[[:space:]]*'([^']+)'\);.*/\1/")"

          HEADER_VERSION="$(echo "$HEADER_VERSION" | tr -d '\r' | xargs)"
          CONST_VERSION="$(echo "$CONST_VERSION" | tr -d '\r' | xargs)"

          if [[ -z "$HEADER_VERSION" || -z "$CONST_VERSION" ]]; then
            echo "Could not read version from plugin file."
            exit 1
          fi

          if [[ "$HEADER_VERSION" != "$CONST_VERSION" ]]; then
            echo "Plugin header version ($HEADER_VERSION) does not match internal version ($CONST_VERSION)."
            exit 1
          fi

          echo "version=$HEADER_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$HEADER_VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=roxy-suite-$HEADER_VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "manifest_name=roxy-suite-$HEADER_VERSION.manifest.json" >> "$GITHUB_OUTPUT"

      - name: Check latest release tag
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const response = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput('tag', response.data.tag_name || '');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('tag', '');
                return;
              }
              throw error;
            }

      - name: Decide whether to release
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          NEW_TAG="${{ steps.version.outputs.tag }}"
          LATEST_TAG="${{ steps.latest.outputs.tag }}"

          if [[ -z "$LATEST_TAG" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION="${NEW_TAG#v}"
          LATEST_VERSION="${LATEST_TAG#v}"

          if [[ "$NEW_VERSION" == "$LATEST_VERSION" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HIGHEST="$(printf '%s\n%s\n' "$LATEST_VERSION" "$NEW_VERSION" | sort -V | tail -n1)"
          if [[ "$HIGHEST" == "$NEW_VERSION" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit when no new version is present
        if: steps.compare.outputs.should_release != 'true'
        shell: bash
        run: |
          echo "No release created. Plugin version was not higher than the latest GitHub release."

      - name: Reject an already-used version tag
        if: steps.compare.outputs.should_release == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.version.outputs.tag }}";
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              throw new Error(`Refusing to reuse existing release tag ${tag}.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Build plugin zip
        if: steps.compare.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          STAGE_DIR="build/roxy-suite"
          ZIP_PATH="build/${{ steps.version.outputs.zip_name }}"

          rm -rf build
          mkdir -p "$STAGE_DIR"

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='/.gitignore' \
            --exclude='build' \
            --exclude='/tests/' \
            --exclude='/docs/' \
            --exclude='/tools/' \
            --exclude='/RoxyEdit.md' \
            --exclude='.DS_Store' \
            ./ "$STAGE_DIR"/

          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export TZ=UTC
          find "$STAGE_DIR" -type f -exec touch -d "@$SOURCE_DATE_EPOCH" {} +

          (
            cd build
            find roxy-suite -type f -print | LC_ALL=C sort | zip -X "${{ steps.version.outputs.zip_name }}" -@ >/dev/null
          )

          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "Zip was not created."
            exit 1
          fi

          SOURCE_SHA="$GITHUB_SHA" \
          RELEASE_VERSION="${{ steps.version.outputs.version }}" \
          ZIP_NAME="${{ steps.version.outputs.zip_name }}" \
          MANIFEST_NAME="${{ steps.version.outputs.manifest_name }}" \
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = path.resolve('build/roxy-suite');
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true }).sort((a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0)) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile()) {
                const relative = path.relative(path.resolve('build'), full).split(path.sep).join('/');
                files.push({ path: relative, sha256: crypto.createHash('sha256').update(fs.readFileSync(full)).digest('hex') });
              } else {
                throw new Error(`Unsupported package entry: ${full}`);
              }
            }
          }
          walk(root);
          files.sort((a, b) => a.path < b.path ? -1 : a.path > b.path ? 1 : 0);
          const archivePath = path.resolve('build', process.env.ZIP_NAME);
          const manifest = {
            format_version: 1,
            source_sha: process.env.SOURCE_SHA,
            version: process.env.RELEASE_VERSION,
            archive: {
              file: process.env.ZIP_NAME,
              sha256: crypto.createHash('sha256').update(fs.readFileSync(archivePath)).digest('hex')
            },
            files
          };
          fs.writeFileSync(path.resolve('build', process.env.MANIFEST_NAME), JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Create Git tag
        if: steps.compare.outputs.should_release == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.version.outputs.tag }}";
            const sha = context.sha;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              throw new Error(`Refusing to reuse existing release tag ${tag}.`);
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha
              });
            }

      - name: Create GitHub release
        if: steps.compare.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Roxy Suite ${{ steps.version.outputs.version }}
          files: |
            build/${{ steps.version.outputs.zip_name }}
            build/${{ steps.version.outputs.manifest_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
