name: PHP compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all plugin runtime PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            php -l "$file" >/dev/null
          done < <(git ls-files '*.php' ':!:tests/**' ':!:tools/**')

      - name: Run showing selector regression
        run: php tests/showing-selection-regression.php "$GITHUB_WORKSPACE"

      - name: Run Will Call regression
        run: php tests/will-call-regression.php "$GITHUB_WORKSPACE"

      - name: Run Grosses log-result regression
        run: php tests/grosses-log-result-regression.php
