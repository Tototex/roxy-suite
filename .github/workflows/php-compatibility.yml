name: PHP compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all tracked PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            php -l "$file" >/dev/null
          done < <(git ls-files '*.php')

      - name: Run showing selector regression
        run: php tests/showing-selection-regression.php "$GITHUB_WORKSPACE"

      - name: Run Will Call regression
        run: php tests/will-call-regression.php "$GITHUB_WORKSPACE"

      - name: Run Grosses log-result regression
        run: php tests/grosses-log-result-regression.php

      - name: Run advertiser email attachment regression
        run: php tests/grosses-advertiser-email-outbox-regression.php

      - name: Run workbook snapshot atomicity regression
        run: php tests/grosses-workbook-atomic-regression.php

      - name: Run isolated cross-module regression suite
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            arcade-prize-regression.php
            arcade-review-gate-regression.php
            arcade-score-regression.php
            booking-refund-regression.php
            c6-governance-regression.php
            capacity-walkup-regression.php
            checkout-cart-regression.php
            core-storage-regression.php
            deployment-manifest-regression.php
            grosses-attachments-regression.php
            grosses-closed-day-retry-regression.php
            grosses-closed-day-store-regression.php
            grosses-export-regression.php
            grosses-fresh-email-allocation-regression.php
            grosses-list-compatibility-regression.php
            grosses-refund-auto-regression.php
            grosses-refund-reporter-regression.php
            grosses-refund-snapshot-regression.php
            grosses-reporter-snapshot-rebalance-regression.php
            grosses-sale-snapshot-regression.php
            grosses-saved-report-readonly-regression.php
            grosses-scheduler-calendar-regression.php
            grosses-secrets-regression.php
            grosses-square-money-regression.php
            grosses-square-response-regression.php
            grosses-square-returns-regression.php
            grosses-workbook-calendar-regression.php
            grosses-workbook-private-dir-regression.php
            health-advertiser-freshness-regression.php
            health-freshness-regression.php
            health-record-read-regression.php
            health-scheduler-outcome-regression.php
            inventory-decision-regression.php
            inventory-cost-schema-regression.php
            inventory-handler-errors-regression.php
            inventory-integrity-regression.php
            inventory-regression.php
            inventory-settings-callback-regression.php
            inventory-square-response-regression.php
            member-door-regression.php
            member-export-regression.php
            member-regression.php
            members-dashboard-regression.php
            requested-agreement-conversion-regression.php
            requested-agreement-regression.php
            requested-entitlement-regression.php
            requested-funding-read-regression.php
            requested-money-regression.php
            requested-payment-attempt-regression.php
            requested-payment-review-render-regression.php
            requested-payment-status-regression.php
            requested-privacy-regression.php
            sales-payment-refund-regression.php
            schedule-child-status-regression.php
            social-account-regression.php
            social-ai-references-regression.php
            social-ai-retry-regression.php
            social-ai-snapshot-regression.php
            social-bulk-editor-regression.php
            social-cleanup-regression.php
            social-film-context-regression.php
            social-hangar-thumbnail-security-regression.php
            social-publisher-regression.php
            social-review-confirmation-regression.php
            social-secrets-regression.php
            social-showtime-regression.php
            stability-regression.php
            ticket-cart-pricing-regression.php
            ticket-eligibility-regression.php
            ticket-hold-settings-regression.php
            ticket-publication-regression.php
            updater-integrity-regression.php
          )
          for test in "${tests[@]}"; do
            echo "Running $test"
            if [[ "$test" == 'inventory-regression.php' ]]; then
              php "tests/$test" "$GITHUB_WORKSPACE/includes/modules/inventory/includes"
            elif [[ "$test" == 'members-dashboard-regression.php' ]]; then
              php "tests/$test" --baseline-ref 6e730f0 "$GITHUB_WORKSPACE/includes/class-roxy-suite-members-dashboard.php"
            elif [[ "$test" == 'social-film-context-regression.php' || "$test" == 'social-ai-references-regression.php' || "$test" == 'social-ai-retry-regression.php' ]]; then
              php "tests/$test" "$GITHUB_WORKSPACE/includes/modules/social-publisher/includes"
            else
              php "tests/$test"
            fi
          done
